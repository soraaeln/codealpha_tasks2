{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password | Fleek</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-layout">
    <div class="auth-panel">
      <p class="eyebrow">Reset</p>
      <h1>Forgot your password?</h1>
      <p class="muted">Enter your email and we'll send a reset code.</p>
    </div>
    <form method="post" class="card auth-card">
      {% csrf_token %}
      <h2>Reset Password</h2>
      {% if messages %}
        {% for message in messages %}
          <p class="message">{{ message }}</p>
        {% endfor %}
      {% endif %}
      <input type="email" name="email" placeholder="Email" required>
      <button type="submit">Send Reset Code</button>
      <p class="muted"><a href="{% url 'login' %}">Back to login</a></p>
    </form>
  </div>
</body>
</html>
