{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reset Password | Fleek</title>
  <link rel="stylesheet" href="{% static 'css/app.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="auth-page">
  <div class="auth-layout">
    <div class="auth-panel">
      <p class="eyebrow">Reset</p>
      <h1>Set a new password.</h1>
      <p class="muted">Use the reset code sent to your email.</p>
    </div>
    <form method="post" class="card auth-card">
      {% csrf_token %}
      <h2>Reset Password</h2>
      {% if messages %}
        {% for message in messages %}
          <p class="message">{{ message }}</p>
        {% endfor %}
      {% endif %}
      <input type="email" name="email" value="{{ email }}" placeholder="Email" required>
      <input type="text" name="code" placeholder="Reset code" required>
      <div class="password-field">
        <input type="password" name="new_password" placeholder="New password" id="reset-password" required>
        <button type="button" class="eye-button" onclick="togglePassword('reset-password', this)">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>
      <div class="password-field">
        <input type="password" name="confirm_password" placeholder="Confirm password" id="reset-password2" required>
        <button type="button" class="eye-button" onclick="togglePassword('reset-password2', this)">
          <i class="fa-solid fa-eye"></i>
        </button>
      </div>
      <button type="submit">Update Password</button>
      <p class="muted"><a href="{% url 'login' %}">Back to login</a></p>
    </form>
  </div>
  <script>
    function togglePassword(id, button) {
      const input = document.getElementById(id);
      const icon = button.querySelector("i");
      if (input.type === "password") {
        input.type = "text";
        icon.classList.remove("fa-eye");
        icon.classList.add("fa-eye-slash");
      } else {
        input.type = "password";
        icon.classList.add("fa-eye");
        icon.classList.remove("fa-eye-slash");
      }
    }
  </script>
</body>
</html>
